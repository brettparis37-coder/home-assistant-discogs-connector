# Add both automations to /config/automations.yaml, then reload automations.
- id: discogs_random_record_from_hue_dial
  alias: Hue dial - Pick a random Discogs record on Tidbyt
  mode: single
  triggers:
    - trigger: event.received
      target:
        entity_id: event.unassigned_hue_tap_dial_switch_1_button_4
      options:
        event_type:
          - short_release
  actions:
    - action: script.show_discogs_random_record_on_tidbyt

- id: discogs_random_pick_cancel_for_volume
  alias: Hue dial - Interrupt random Tidbyt pick for volume
  mode: restart
  triggers:
    - trigger: event.received
      target:
        entity_id: event.unassigned_hue_tap_dial_switch_1_rotary
      options:
        event_type:
          - clock_wise
          - counter_clock_wise
  actions:
    - action: script.turn_off
      target:
        entity_id: script.show_discogs_random_record_on_tidbyt
    - action: tidbytassistant.delete
      data:
        contentid: discogspick
        devicename:
          - living_room

