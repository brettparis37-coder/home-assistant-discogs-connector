name: Discogs Connector
version: "0.7.4"
slug: discogs_connector
description: Search your Discogs collection from a private Home Assistant panel.
homeassistant_api: true
startup: application
boot: auto
init: false
arch:
  - amd64
  - aarch64
ingress: true
ingress_port: 8099
panel_icon: mdi:disc
panel_title: Discogs Collection
panel_admin: false
map:
  - share:rw
options:
  discogs_username: IPAIRIS
  discogs_token: ""
  refresh_schedule_enabled: true
  refresh_interval_hours: 24
  enrich_collection_details: true
schema:
  discogs_username: str
  discogs_token: password
  refresh_schedule_enabled: bool
  refresh_interval_hours: int(1,168)
  enrich_collection_details: bool

